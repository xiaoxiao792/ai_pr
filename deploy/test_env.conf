# ============================================================
# PR-Agent GitLab Webhook — 测试环境配置
# 用法: cp test_env.conf env.conf 然后改里面的值
# ============================================================

# ---------- 服务配置 ----------
# Git 平台类型: github / gitlab / gitea 等
GIT_PROVIDER=gitlab
# 对外暴露的服务端口
SERVICE_PORT=3000
# Docker 容器名称
CONTAINER_NAME=pr-agent-gitlab

# ---------- AI 模型配置 ----------
OPENAI_API_KEY=sk-请替换为你的key
OPENAI_API_BASE=http://请替换为你的newapi地址/v1
MODEL_NAME=openai/deepseek-v4-pro
FALLBACK_MODELS='["openai/deepseek-v4-pro"]'
AI_TIMEOUT=600
MAX_MODEL_TOKENS=65536
CUSTOM_MODEL_MAX_TOKENS=131072

# ---------- GitLab 配置 ----------
GITLAB_URL=https://请替换为你的gitlab地址
GITLAB_PAT=glpat-请替换为你的personal-access-token
GITLAB_SHARED_SECRET=请替换为一个随机字符串
GITLAB_SSL_VERIFY=true
# 认证方式: oauth_token (gitlab.com) / private_token (私有部署)
GITLAB_AUTH_TYPE=private_token

# ---------- PR-Agent 自动触发命令 ----------
PR_COMMANDS='["/describe", "/review"]'
PUSH_COMMANDS='["/describe", "/review"]'
HANDLE_PUSH_TRIGGER=false

# ---------- 运行时配置 ----------
LOG_LEVEL=DEBUG
VERBOSITY_LEVEL=0
RESPONSE_LANGUAGE=zh-CN
